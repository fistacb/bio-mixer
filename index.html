<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生物ミキサー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<main>
  <header>
    <h1>生物ミキサー</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" data-mode="c" aria-selected="true">C：事前生成<span>なめらか・軽い</span></button>
      <button role="tab" data-mode="a" aria-selected="false">A：ブラウザでデコード<span>latent補間</span></button>
    </nav>
  </header>

  <section class="controls">
    <label>スタイル <select id="style"></select></label>
  </section>

  <section class="stage">
    <div class="pick" id="pickA"></div>
    <div class="view">
      <div class="frame" id="frameC">
        <img id="imgC0" alt="">
        <img id="imgC1" alt="">
      </div>
      <canvas id="frameA" width="512" height="512" hidden></canvas>
      <div class="status" id="status"></div>
    </div>
    <div class="pick" id="pickB"></div>
  </section>

  <section class="slider">
    <span id="nameA">A</span>
    <input type="range" id="t" min="0" max="1000" value="500">
    <span id="nameB">B</span>
  </section>

  <footer class="credits">
    <p>画像生成：「ファンタジーアニメ」は <a href="https://huggingface.co/cagliostrolab/animagine-xl-4.0" rel="noopener">Animagine XL 4.0</a>（ライセンス：CreativeML Open RAIL++-M、詳細はモデルページ）、「ダークファンタジー」は <a href="https://huggingface.co/stabilityai/sd-turbo" rel="noopener">SD-Turbo</a>（Stability AI）で生成。</p>
    <p>ブラウザでのデコード：<a href="https://github.com/madebyollin/taesd" rel="noopener">TAESD / TAESDXL</a>（MIT）、<a href="https://onnxruntime.ai/" rel="noopener">ONNX Runtime Web</a>。中間状態の崩れや奇妙さも含めて遊ぶ技術デモです。</p>
  </footer>

  <details class="dev" id="dev" hidden>
    <summary>開発用設定</summary>
    <label><input type="radio" name="interp" value="lerp" checked> Linear</label>
    <label><input type="radio" name="interp" value="slerp"> Slerp</label>
    <p id="devinfo"></p>
  </details>
</main>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.js"></script>
<script src="app.js?v=7"></script>
</body>
</html>
